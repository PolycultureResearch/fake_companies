[project]
name = "fake-companies"
version = "0.1.0"
description = "Generator of realistic synthetic raw company data with ground-truth-labeled anomalies for testing Breakdown and Tremor."
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [{ name = "Devon" }]
dependencies = [
    "numpy>=2.2",
    "pandas>=2.2",
    "pyarrow>=18",
    "duckdb>=1.1",
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "typer>=0.15",
    "faker>=33",
    "holidays>=0.60",
]

[project.optional-dependencies]
dbt = [
    "dbt-core>=1.9",
    "dbt-duckdb>=1.9",
    "dbt-metricflow>=0.8",
]

[project.scripts]
fake-companies = "fake_companies.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fake_companies"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
extend-select = ["I"]

[tool.ruff.lint.per-file-ignores]
# typer uses function calls in argument defaults by design.
"src/fake_companies/cli.py" = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: statistical / end-to-end suite (deselect with -m 'not slow')",
]
