version: 2

sources:
  - name: ad_platform
    schema: ad_platform
    tables:
      - name: ad_spend
        loaded_at_field: _loaded_at
        freshness:
          warn_after: { count: 72, period: hour }
          error_after: { count: 168, period: hour }
        columns:
          - name: spend_id
            tests: [not_null]

  - name: web
    schema: web
    tables:
      - name: sessions
        loaded_at_field: _loaded_at
        freshness:
          warn_after: { count: 72, period: hour }
          error_after: { count: 168, period: hour }
        columns:
          - name: session_id
            tests: [not_null]

  - name: shop_db
    schema: shop_db
    tables:
      - name: products
        loaded_at_field: _loaded_at
        columns:
          - name: sku_id
            tests: [not_null]
      - name: customers
        loaded_at_field: _loaded_at
        freshness:
          warn_after: { count: 72, period: hour }
          error_after: { count: 168, period: hour }
        columns:
          - name: customer_id
            tests: [not_null]
      - name: orders
        loaded_at_field: _loaded_at
        freshness:
          warn_after: { count: 72, period: hour }
          error_after: { count: 168, period: hour }
        columns:
          - name: order_id
            tests: [not_null]
      - name: order_items
        loaded_at_field: _loaded_at
        freshness:
          warn_after: { count: 72, period: hour }
          error_after: { count: 168, period: hour }
        columns:
          - name: order_item_id
            tests: [not_null]
      - name: returns
        loaded_at_field: _loaded_at
        columns:
          - name: return_id
            tests: [not_null]

  - name: fulfillment
    schema: fulfillment
    tables:
      - name: shipments
        loaded_at_field: _loaded_at
        freshness:
          warn_after: { count: 72, period: hour }
          error_after: { count: 168, period: hour }
        columns:
          - name: shipment_id
            tests: [not_null]

  - name: payments
    schema: payments
    tables:
      - name: transactions
        loaded_at_field: _loaded_at
        freshness:
          warn_after: { count: 72, period: hour }
          error_after: { count: 168, period: hour }
        columns:
          - name: payment_id
            tests: [not_null]
